name: Build Saman Kitabi APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create project v3 design test
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/samankitabi/app app/src/main/res/values app/src/main/res/drawable
          echo  | base64 -d > settings.gradle.kts
          echo cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKfQo= | base64 -d > build.gradle.kts
          echo  | base64 -d > app/build.gradle.kts
          echo  | base64 -d > app/src/main/AndroidManifest.xml
          echo  | base64 -d > app/src/main/res/values/styles.xml
          echo  | base64 -d > app/src/main/res/drawable/ic_launcher.xml
          echo  | base64 -d > app/src/main/java/com/samankitabi/app/MainActivity.java
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamanKitabi-v3-design-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
