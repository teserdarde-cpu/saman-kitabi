
name: Build Saman Kitabi APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate proven V4 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import urllib.request, subprocess, sys
          url='https://raw.githubusercontent.com/teserdarde-cpu/saman-kitabi/6f2e8d7709a34651c0b6266bbe62a47df9052209/.github/workflows/build-apk.yml'
          raw=urllib.request.urlopen(url,timeout=30).read().decode('utf-8')
          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable,'-m','pip','install','--quiet','pyyaml'])
              import yaml
          data=yaml.safe_load(raw)
          steps=data['jobs']['build']['steps']
          target=next((s for s in steps if str(s.get('name','')).lower().startswith('create project v4')),None)
          if not target or 'run' not in target:
              raise SystemExit('V4 project creation step not found')
          script=target['run']
          from pathlib import Path
          sh=Path('/tmp/recreate_v4.sh')
          sh.write_text(script, encoding='utf-8')
          sh.chmod(0o755)
          subprocess.run(['/bin/bash', str(sh)], check=True)
          PY2
      - name: Apply V5.5 decorative visibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import base64

          res = Path('app/src/main/res/drawable-nodpi')
          res.mkdir(parents=True, exist_ok=True)
          assets = {
              'border_left.png': '',
              'border_right.png': '',
              'divider.png': '',
              'sigil.png': '',
          }
          for name, data in assets.items():
              (res / name).write_bytes(base64.b64decode(data))

          p = Path('app/src/main/java/com/samankitabi/app/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          bg = 'private GradientDrawable bg(int color,float r){ GradientDrawable g=new GradientDrawable(); g.setColor(color); g.setCornerRadius(dp((int)r)); return g; }'
          panel = 'private GradientDrawable bg(int color,float r){ GradientDrawable g=new GradientDrawable(); g.setColor(color); g.setCornerRadius(dp((int)r)); return g; }\n    private GradientDrawable panel(int color,float r){ GradientDrawable g=new GradientDrawable(); g.setColor(color); g.setCornerRadius(dp((int)r)); g.setStroke(dp(1),Color.argb(165,214,178,92)); return g; }'
          if 'private GradientDrawable panel(' not in s:
              s = s.replace(bg, panel)

          s = s.replace('v.setBackground(bg(PANEL,12));', 'v.setBackground(panel(Color.argb(190,27,30,31),12));')

          old_base = 'private LinearLayout base(String active){\n        ScrollView sc=new ScrollView(this); sc.setFillViewport(true);\n        if(active.equals("Ana Sayfa")){\n            sc.setBackgroundResource(R.drawable.home_bg);\n        } else {\n            sc.setBackgroundColor(BG);\n        }\n        LinearLayout wrap=new LinearLayout(this); wrap.setOrientation(LinearLayout.VERTICAL); wrap.setPadding(dp(18),dp(24),dp(18),dp(32));\n        if(active.equals("Ana Sayfa")) wrap.setBackgroundColor(Color.argb(135,15,17,18)); else wrap.setBackgroundColor(BG);\n        sc.addView(wrap);\n        TextView head=tv("ŞAMAN KİTABI",29,GOLD); head.setGravity(Gravity.CENTER); head.setTypeface(null,Typeface.BOLD); wrap.addView(head);\n        TextView tag=tv("IRK BİTİG • çevrimdışı",12,MUTED); tag.setGravity(Gravity.CENTER); wrap.addView(tag);\n        LinearLayout nav=new LinearLayout(this); nav.setGravity(Gravity.CENTER); nav.setPadding(0,dp(10),0,dp(14));\n        String[] names={"Ana Sayfa","65 Fal","Rehber"}; for(String n:names){ TextView c=chip(n); if(n.equals(active)) c.setTextColor(TEXT); c.setTypeface(null,Typeface.BOLD); c.setOnClickListener(v->{ if(n.equals("Ana Sayfa"))showHome(); else if(n.equals("65 Fal"))showLibrary(); else showGuide(); }); nav.addView(c,new LinearLayout.LayoutParams(0,-2,1)); } wrap.addView(nav);\n        setContentView(sc); root=wrap; return wrap;\n    }'
          new_base = 'private LinearLayout base(String active){\n        FrameLayout stage=new FrameLayout(this);\n        ScrollView sc=new ScrollView(this); sc.setFillViewport(true);\n        if(active.equals("Ana Sayfa")) sc.setBackgroundResource(R.drawable.home_bg); else sc.setBackgroundColor(BG);\n        stage.addView(sc,new FrameLayout.LayoutParams(-1,-1));\n\n        LinearLayout wrap=new LinearLayout(this); wrap.setOrientation(LinearLayout.VERTICAL); wrap.setPadding(dp(18),dp(24),dp(18),dp(32));\n        if(active.equals("Ana Sayfa")) wrap.setBackgroundColor(Color.argb(96,15,17,18)); else wrap.setBackgroundColor(BG);\n        sc.addView(wrap);\n\n        if(active.equals("Ana Sayfa")){\n            ImageView leftB=new ImageView(this); leftB.setImageResource(R.drawable.border_left); leftB.setAlpha(0.55f); leftB.setScaleType(ImageView.ScaleType.FIT_CENTER);\n            FrameLayout.LayoutParams l1=new FrameLayout.LayoutParams(dp(72),dp(360)); l1.gravity=Gravity.START|Gravity.TOP; l1.leftMargin=dp(2); l1.topMargin=dp(104); stage.addView(leftB,l1);\n            ImageView rightB=new ImageView(this); rightB.setImageResource(R.drawable.border_right); rightB.setAlpha(0.55f); rightB.setScaleType(ImageView.ScaleType.FIT_CENTER);\n            FrameLayout.LayoutParams l2=new FrameLayout.LayoutParams(dp(72),dp(360)); l2.gravity=Gravity.END|Gravity.TOP; l2.rightMargin=dp(2); l2.topMargin=dp(104); stage.addView(rightB,l2);\n        }\n\n        TextView head=tv("ŞAMAN KİTABI",29,GOLD); head.setGravity(Gravity.CENTER); head.setTypeface(null,Typeface.BOLD); wrap.addView(head);\n        TextView tag=tv("IRK BİTİG • çevrimdışı",12,MUTED); tag.setGravity(Gravity.CENTER); wrap.addView(tag);\n        LinearLayout nav=new LinearLayout(this); nav.setGravity(Gravity.CENTER); nav.setPadding(0,dp(10),0,dp(14));\n        String[] names={"Ana Sayfa","65 Fal","Rehber"}; for(String n:names){ TextView c=chip(n); if(n.equals(active)) c.setTextColor(TEXT); c.setTypeface(null,Typeface.BOLD); c.setOnClickListener(v->{ if(n.equals("Ana Sayfa"))showHome(); else if(n.equals("65 Fal"))showLibrary(); else showGuide(); }); nav.addView(c,new LinearLayout.LayoutParams(0,-2,1)); } wrap.addView(nav);\n        setContentView(stage); root=wrap; return wrap;\n    }'
          if old_base not in s:
              raise SystemExit('V4 base block not found')
          s = s.replace(old_base, new_base)

          old_showhome = 'private void showHome(){\n        LinearLayout wrap=base("Ana Sayfa");\n        TextView intro=tv("Niyetini tut, işaretleri oku.",19,TEXT); intro.setGravity(Gravity.CENTER); intro.setTypeface(null,Typeface.BOLD); intro.setPadding(0,dp(14),0,dp(4)); wrap.addView(intro);\n        TextView hint=tv("Her soru için tek atış",13,MUTED); hint.setGravity(Gravity.CENTER); wrap.addView(hint);\n\n        diceRow=new LinearLayout(this); diceRow.setOrientation(LinearLayout.HORIZONTAL); diceRow.setGravity(Gravity.CENTER); diceRow.setPadding(dp(8),dp(18),dp(8),dp(18));\n        diceRow.setBackground(bg(Color.argb(125,20,23,24),20));\n        for(int i=0;i<3;i++){\n            ImageView iv=new ImageView(this); iv.setScaleType(ImageView.ScaleType.CENTER_INSIDE); iv.setPadding(dp(5),dp(5),dp(5),dp(5)); diceViews[i]=iv;\n            LinearLayout.LayoutParams ip=new LinearLayout.LayoutParams(0,dp(112),1); ip.leftMargin=dp(3); ip.rightMargin=dp(3); diceRow.addView(iv,ip);\n        }\n        LinearLayout.LayoutParams dlp=new LinearLayout.LayoutParams(-1,dp(150)); dlp.topMargin=dp(20); wrap.addView(diceRow,dlp);\n        clearDiceImages();\n\n        rollBtn=button("Zar At"); LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(-1,dp(58)); bp.topMargin=dp(4); wrap.addView(rollBtn,bp); rollBtn.setOnClickListener(v->animateRoll());\n\n        resultBox=new LinearLayout(this); resultBox.setOrientation(LinearLayout.VERTICAL); resultBox.setPadding(dp(14),dp(14),dp(14),dp(14)); resultBox.setBackground(bg(Color.argb(225,27,30,31),16)); resultBox.setVisibility(View.GONE); LinearLayout.LayoutParams rp=new LinearLayout.LayoutParams(-1,-2); rp.topMargin=dp(18); wrap.addView(resultBox,rp);\n        resultTitle=tv("",21,GOLD); resultTitle.setTypeface(null,Typeface.BOLD); resultBox.addView(resultTitle); resultText=tv("",16,TEXT); resultBox.addView(resultText);\n\n        Button clear=button("Yeni Atış"); clear.setOnClickListener(v->{ clearDiceImages(); resultBox.setVisibility(View.GONE); }); LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,-2); cp.topMargin=dp(12); wrap.addView(clear,cp);\n    }'
          new_showhome = 'private void showHome(){\n        LinearLayout wrap=base("Ana Sayfa");\n\n        FrameLayout hero=new FrameLayout(this); LinearLayout.LayoutParams hp=new LinearLayout.LayoutParams(-1,dp(188)); hp.topMargin=dp(6); wrap.addView(hero,hp);\n        ImageView sigil=new ImageView(this); sigil.setImageResource(R.drawable.sigil); sigil.setAlpha(0.34f); sigil.setScaleType(ImageView.ScaleType.FIT_CENTER);\n        FrameLayout.LayoutParams sp=new FrameLayout.LayoutParams(dp(244),dp(244)); sp.gravity=Gravity.CENTER; hero.addView(sigil,sp);\n\n        LinearLayout heroText=new LinearLayout(this); heroText.setOrientation(LinearLayout.VERTICAL); heroText.setGravity(Gravity.CENTER);\n        hero.addView(heroText,new FrameLayout.LayoutParams(-1,-1));\n        TextView intro=tv("Niyetini tut, işaretleri oku.",20,TEXT); intro.setGravity(Gravity.CENTER); intro.setTypeface(null,Typeface.BOLD); heroText.addView(intro);\n        TextView hint=tv("Her soru için tek atış",13,MUTED); hint.setGravity(Gravity.CENTER); heroText.addView(hint);\n        TextView motto=tv("KÖKLERDE BİLGELİK, BUGÜNDE YOL.",11,GOLD); motto.setGravity(Gravity.CENTER); motto.setPadding(0,dp(8),0,0); heroText.addView(motto);\n\n        LinearLayout infoRow=new LinearLayout(this); infoRow.setOrientation(LinearLayout.HORIZONTAL); infoRow.setGravity(Gravity.CENTER); LinearLayout.LayoutParams irp=new LinearLayout.LayoutParams(-1,-2); irp.topMargin=dp(2); wrap.addView(infoRow,irp);\n        TextView c1=chip("Çevrimdışı"); TextView c2=chip("Kayıt tutmaz");\n        LinearLayout.LayoutParams cpa=new LinearLayout.LayoutParams(0,-2,1); cpa.rightMargin=dp(4);\n        LinearLayout.LayoutParams cpb=new LinearLayout.LayoutParams(0,-2,1); cpb.leftMargin=dp(4);\n        infoRow.addView(c1,cpa); infoRow.addView(c2,cpb);\n\n        diceRow=new LinearLayout(this); diceRow.setOrientation(LinearLayout.HORIZONTAL); diceRow.setGravity(Gravity.CENTER); diceRow.setPadding(dp(10),dp(18),dp(10),dp(18));\n        diceRow.setBackground(panel(Color.argb(168,20,23,24),22));\n        for(int i=0;i<3;i++){\n            ImageView iv=new ImageView(this); iv.setScaleType(ImageView.ScaleType.CENTER_INSIDE); iv.setPadding(dp(5),dp(5),dp(5),dp(5)); diceViews[i]=iv;\n            LinearLayout.LayoutParams ip=new LinearLayout.LayoutParams(0,dp(112),1); ip.leftMargin=dp(3); ip.rightMargin=dp(3); diceRow.addView(iv,ip);\n        }\n        LinearLayout.LayoutParams dlp=new LinearLayout.LayoutParams(-1,dp(150)); dlp.topMargin=dp(14); wrap.addView(diceRow,dlp);\n        clearDiceImages();\n\n        ImageView divider=new ImageView(this); divider.setImageResource(R.drawable.divider); divider.setAlpha(0.98f); divider.setScaleType(ImageView.ScaleType.FIT_CENTER);\n        LinearLayout.LayoutParams dvp=new LinearLayout.LayoutParams(-1,dp(28)); dvp.topMargin=dp(8); wrap.addView(divider,dvp);\n\n        rollBtn=button("Zar At"); LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(-1,dp(58)); bp.topMargin=dp(8); wrap.addView(rollBtn,bp); rollBtn.setOnClickListener(v->animateRoll());\n\n        resultBox=new LinearLayout(this); resultBox.setOrientation(LinearLayout.VERTICAL); resultBox.setPadding(dp(14),dp(14),dp(14),dp(14)); resultBox.setBackground(panel(Color.argb(232,27,30,31),16)); resultBox.setVisibility(View.GONE); LinearLayout.LayoutParams rp=new LinearLayout.LayoutParams(-1,-2); rp.topMargin=dp(18); wrap.addView(resultBox,rp);\n        resultTitle=tv("",21,GOLD); resultTitle.setTypeface(null,Typeface.BOLD); resultBox.addView(resultTitle); resultText=tv("",16,TEXT); resultBox.addView(resultText);\n\n        Button clear=button("Yeni Atış"); clear.setOnClickListener(v->{ clearDiceImages(); resultBox.setVisibility(View.GONE); }); LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,-2); cp.topMargin=dp(12); wrap.addView(clear,cp);\n    }'
          if old_showhome not in s:
              raise SystemExit('V4 showHome block not found')
          s = s.replace(old_showhome, new_showhome)

          s = s.replace('row.setBackground(bg(PANEL,12));','row.setBackground(panel(Color.argb(230,27,30,31),12));')
          s = s.replace('lay.setBackground(bg(PANEL,16));','lay.setBackground(panel(Color.argb(230,27,30,31),16));')
          p.write_text(s, encoding='utf-8')
          PY2
      - name: Bump version label
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('versionCode = 4','versionCode = 6')
          s=s.replace('versionName = "4.0-visual-test"','versionName = "5.5-decor-boost"')
          p.write_text(s,encoding='utf-8')
          PY2
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamanKitabi-v5.5-decor-boost-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
