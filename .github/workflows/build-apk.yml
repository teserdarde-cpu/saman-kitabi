name: Build Saman Kitabi APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate proven V4 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import urllib.request, subprocess, sys
          url='https://raw.githubusercontent.com/teserdarde-cpu/saman-kitabi/6f2e8d7709a34651c0b6266bbe62a47df9052209/.github/workflows/build-apk.yml'
          raw=urllib.request.urlopen(url,timeout=30).read().decode('utf-8')
          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable,'-m','pip','install','--quiet','pyyaml'])
              import yaml
          data=yaml.safe_load(raw)
          steps=data['jobs']['build']['steps']
          target=next((s for s in steps if str(s.get('name','')).lower().startswith('create project v4')),None)
          if not target or 'run' not in target:
              raise SystemExit('V4 project creation step not found')
          script=target['run']
          from pathlib import Path
          sh=Path('/tmp/recreate_v4.sh')
          sh.write_text(script, encoding='utf-8')
          sh.chmod(0o755)
          subprocess.run(['/bin/bash', str(sh)], check=True)
          PY2
      - name: Apply V5.4 layered UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          p=Path('app/src/main/java/com/samankitabi/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          bg='private GradientDrawable bg(int color,float r){ GradientDrawable g=new GradientDrawable(); g.setColor(color); g.setCornerRadius(dp((int)r)); return g; }'
          panel=bg+'\n    private GradientDrawable panel(int color,float r){ GradientDrawable g=new GradientDrawable(); g.setColor(color); g.setCornerRadius(dp((int)r)); g.setStroke(dp(1),Color.argb(125,214,178,92)); return g; }'
          if 'private GradientDrawable panel(' not in s:
              s=s.replace(bg,panel)
          old=base64.b64decode('').decode('utf-8')
          new=base64.b64decode('').decode('utf-8')
          if old not in s:
              raise SystemExit('Expected V4 base() block not found')
          s=s.replace(old,new)
          s=s.replace('resultBox.setBackground(bg(PANEL,16));','resultBox.setBackground(panel(PANEL,16));')
          s=s.replace('row.setBackground(bg(PANEL,12));','row.setBackground(panel(PANEL,12));')
          p.write_text(s,encoding='utf-8')
          PY2
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamanKitabi-v5.4-layered-safe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
